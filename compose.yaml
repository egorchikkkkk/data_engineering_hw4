name: hw4_zookeeper

services:
  zk1:
    image: zookeeper:3.9.6

    restart: "no"

    ports:
      - 2181:2181
      - 8081:8080

    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
    
    volumes:
      - zk1-data:/data
      - zk1-datalog:/datalog

  zk2:
    image: zookeeper:3.9.6

    restart: "no"

    ports:
      - 2182:2181
      - 8082:8080

    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
    
    volumes:
      - zk2-data:/data
      - zk2-datalog:/datalog
  
  zk3:
    image: zookeeper:3.9.6

    restart: "no"

    ports:
      - 2183:2181
      - 8083:8080

    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
    
    volumes:
      - zk3-data:/data
      - zk3-datalog:/datalog

volumes:
  zk1-data:
  zk1-datalog:
  zk2-data:
  zk2-datalog:
  zk3-data:
  zk3-datalog: